<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Thomasson | Levata</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a3a 0%, #2c4050 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.3);
            text-align: center;
            border-top: 5px solid #0056a7;
        }
        
        .logo-container {
            margin-bottom: 30px;
            padding: 25px;
            background: #f5f8fc;
            border-radius: 20px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-container img {
            max-width: 350px;
            max-height: 140px;
            width: auto;
            height: auto;
            display: inline-block;
        }
        
        .name {
            font-size: 2.8rem;
            font-weight: 500;
            color: #1a2a3a;
            line-height: 1.2;
            margin-bottom: 8px;
            font-family: 'Georgia', serif;
        }
        
        .company {
            font-size: 1.6rem;
            color: #0056a7;
            font-weight: 500;
            margin-bottom: 30px;
            padding-bottom: 18px;
            border-bottom: 2px solid #e5eef5;
            letter-spacing: 0.5px;
        }
        
        .detail {
            margin: 35px 0;
            text-align: left;
            background: #f5f8fc;
            padding: 30px;
            border-radius: 20px;
        }
        
        .detail-item {
            display: flex;
            align-items: flex-start;
            margin: 20px 0;
            font-size: 1.2rem;
        }
        
        .emoji {
            font-size: 1.8rem;
            margin-right: 20px;
            min-width: 40px;
            text-align: center;
            color: #0056a7;
        }
        
        .text {
            color: #2c4050;
            word-break: break-word;
            line-height: 1.5;
        }
        
        .label {
            font-weight: 600;
            color: #0056a7;
            margin-right: 10px;
            min-width: 60px;
            font-size: 1.2rem;
        }
        
        .email {
            color: #0056a7;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.2rem;
        }
        
        .email:hover {
            text-decoration: underline;
        }
        
        .address {
            line-height: 1.6;
        }
        
        .website {
            text-align: center;
            margin: 25px 0 35px;
        }
        
        .website a {
            color: #0056a7;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.6rem;
            border-bottom: 3px solid #cde1f0;
            padding-bottom: 5px;
        }
        
        .website a:hover {
            border-bottom-color: #0056a7;
        }
        
        .vcard-button {
            display: inline-block;
            background: #0056a7;
            color: white;
            text-decoration: none;
            padding: 18px 36px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 500;
            margin: 5px 0 15px;
            box-shadow: 0 8px 18px rgba(0, 86, 167, 0.3);
            transition: all 0.2s;
            width: 100%;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        
        .vcard-button:hover {
            background: #003d7a;
            box-shadow: 0 10px 22px rgba(0, 86, 167, 0.4);
            transform: translateY(-2px);
        }
        
        .vcard-button:active {
            transform: translateY(0);
        }
        
        .hint {
            color: #6f8fa0;
            font-size: 1rem;
            margin-top: 15px;
        }
        
        .location {
            font-weight: 600;
            color: #1a2a3a;
            margin-top: 20px;
            font-size: 1rem;
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            .name {
                font-size: 2.2rem;
            }
            .company {
                font-size: 1.3rem;
            }
            .logo-container img {
                max-width: 280px;
                max-height: 110px;
            }
            .logo-container {
                min-height: 150px;
                padding: 20px;
            }
            .detail-item {
                font-size: 1rem;
            }
            .emoji {
                font-size: 1.5rem;
                margin-right: 15px;
                min-width: 35px;
            }
            .label {
                font-size: 1rem;
                min-width: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <!-- Logo jetzt viel größer (bis zu 350px breit / 140px hoch) -->
            <img src="levata-logo.jpg" alt="Levata" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
            
            <!-- Fallback falls Logo nicht geladen werden kann -->
            <div id="fallback-logo" style="display: none; font-size: 3rem; font-weight: 600; color: #0056a7; letter-spacing: 2px;">
                levata
            </div>
        </div>
        
        <h1 class="name">Andrew Thomasson</h1>
        <div class="company">Levata UK Head Office</div>
        
        <div class="detail">
            <div class="detail-item">
                <span class="emoji">📞</span>
                <span class="text">
                    <span class="label">T:</span> 0161 416 6710
                </span>
            </div>
            <div class="detail-item">
                <span class="emoji">✉️</span>
                <span class="text">
                    <span class="label">M:</span> 
                    <a href="mailto:andrew.thomasson@levata.com" class="email">andrew.thomasson@levata.com</a>
                </span>
            </div>
            <div class="detail-item">
                <span class="emoji">📍</span>
                <span class="text address">
                    <span class="label">UK Office:</span><br>
                    Highbank Court, 3 High Bank Side<br>
                    Stockport, SK1 1HG, UK
                </span>
            </div>
        </div>
        
        <div class="website">
            <a href="https://www.levata.com" target="_blank">www.levata.com</a>
        </div>
        
        <a href="Andrew.vcf" class="vcard-button" rel="noopener noreferrer">
            ⬇️ Save Contact (vCard)
        </a>
        
        <div class="hint">
            Click to save Andrew's contact details to your device
        </div>
        
        <div class="location">
            Levata UK Head Office • Stockport
        </div>
    </div>
    
    <script>
        window.onload = function() {
            var img = document.querySelector('.logo-container img');
            if (img && img.complete && img.naturalHeight === 0) {
                img.style.display = 'none';
                document.getElementById('fallback-logo').style.display = 'block';
            }
        }
    </script>
</body>
</html>
